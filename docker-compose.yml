services:
  bot:
    build: .
    container_name: crypto-bot
    env_file:
      - .env
    volumes:
      # IMPORTANT: host'da ./main.db fayl bo'lishi shart (touch main.db).
      # Bo'lmasa Docker uni directory qilib yaratadi va SQLite ochilmaydi.
      - ./main.db:/app/main.db
      - ./data:/app/data
    restart: unless-stopped
    # Kichik server himoyasi (bot ~100MB yeydi).
    mem_limit: 350m
    # If you want to forward logs or expose a healthcheck port, add ports/healthcheck here
